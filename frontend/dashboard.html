<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Request Logs</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
  <div class="container mx-auto p-6">
    <h1 class="text-2xl font-bold mb-4">Request Logs</h1>
    <div class="overflow-x-auto">
      <table class="min-w-full bg-white border border-gray-200">
        <thead>
          <tr class="bg-gray-200 text-gray-600 uppercase text-sm leading-normal">
            <th class="py-3 px-6 text-left">ID</th>
            <th class="py-3 px-6 text-left">IP</th>
            <th class="py-3 px-6 text-left">Method</th>
            <th class="py-3 px-6 text-left">URL</th>
            <th class="py-3 px-6 text-left">Payload</th>
            <th class="py-3 px-6 text-left">Detected Patterns</th>
            <th class="py-3 px-6 text-left">Highest Severity</th>
            <th class="py-3 px-6 text-left">User Agent</th>
            <th class="py-3 px-6 text-left">Geo</th>
            <th class="py-3 px-6 text-left">Date</th>
          </tr>
        </thead>
        <tbody id="logsTableBody" class="text-gray-600 text-sm font-light">
          <!-- Data will be inserted here -->
        </tbody>
      </table>
    </div>
  </div>

  <script>
    // Fetch data from backend API
    async function fetchData() {
      try {
        const response = await fetch('http://192.168.1.48:5000/api/logs/general/', {
          method: 'GET',
          headers: {
            'Content-Type': 'application/json'
          }
        });

        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }

        const data = await response.json();
        return data;
      } catch (error) {
        console.error('Fetch error:', error);
        return []; // Return empty array if there's an error
      }
    }

    // Populate the table with fetched data
    function populateTable(data) {
      const tableBody = document.getElementById('logsTableBody');
      tableBody.innerHTML = ''; // Clear existing rows

      data.forEach(log => {
        const row = document.createElement('tr');
        row.className = 'border-b border-gray-200 hover:bg-gray-100';

        // Format detectedPatterns
        const patterns = log.detectedPatterns
          ? log.detectedPatterns.map(p => `${p.name} (${p.severity})`).join(', ')
          : 'None';

        // Format geo
        const geo = log.geo ? JSON.stringify(log.geo) : 'N/A';

        // Format date
        const date = log.date ? new Date(log.date).toLocaleString() : 'N/A';

        row.innerHTML = `
          <td class="py-3 px-6">${log._id || 'N/A'}</td>
          <td class="py-3 px-6">${log.ip || 'N/A'}</td>
          <td class="py-3 px-6">${log.method || 'N/A'}</td>
          <td class="py-3 px-6">${log.url || 'N/A'}</td>
          <td class="py-3 px-6">${log.payload || 'N/A'}</td>
          <td class="py-3 px-6">${patterns}</td>
        <td class="py-3 px-6">
          <span class="px-2 py-1 rounded-full text-white text-xs font-semibold ${
            log.highestSeverity === 'high'
              ? 'bg-red-500'
              : log.highestSeverity === 'medium'
              ? 'bg-orange-400'
              : log.highestSeverity === 'low'
              ? 'bg-yellow-400 text-black'
              : 'bg-gray-300'
          }">
            ${log.highestSeverity || 'N/A'}
          </span>
        </td>
          <td class="py-3 px-6">${log.userAgent || 'N/A'}</td>
          <td class="py-3 px-6">${geo}</td>
          <td class="py-3 px-6">${date}</td>
        `;
        tableBody.appendChild(row);
      });
    }

    // Fetch and render data on page load
    window.addEventListener('DOMContentLoaded', async () => {
      const logs = await fetchData();
      populateTable(logs);
    });
  </script>
</body>
</html>
